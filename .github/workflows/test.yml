name: Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ always() }}
    steps:
      - uses: PDLPorters/devops/github-actions/irc-notifications@master
        with:
          target-notifications: true

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]

        # All supported Perl versions except latest.
        perl: [
          '5.16', '5.18',
          '5.20', '5.22', '5.24', '5.26', '5.28',
          '5.30', '5.32'
        ]

        # Variants of the latest Perl.
        include:
          - os: macos-latest
            perl: '5.34'

#          - os: windows-latest
#            perl: '5.34'

          - name: ' (dpss)'
            os: ubuntu-latest
            perl: '5.34'
            dpss: true

          - name: ' (kaiser)'
            os: ubuntu-latest
            perl: '5.34'
            kaiser: true

          - name: ' (plot)'
            os: ubuntu-latest
            perl: '5.34'
            plot: true

          # This is effectively our normal one: all features and cover.
          - name: ' (all)'
            os: ubuntu-latest
            perl: '5.34'
            cover: true
            dpss: true
            kaiser: true
            plot: true

    runs-on: ${{ matrix.os }}

    name: v${{ matrix.perl }} on ${{ matrix.os }}${{ matrix.name }}

    steps:
      - uses: actions/checkout@v2

      - name: 'ci-dist: target-setup-perl'
        uses: PDLPorters/devops/github-actions/ci-dist@master
        with:
          target-setup-perl: true
          perl-version: ${{ matrix.perl }}

      - run: perl -v

      - run: cpanm --installdeps -n . || ( cat ~/.cpanm/build.log && false )

      - if: ${{ matrix.cover }}
        run: cpanm -n Devel::Cover::Report::Coveralls

      - if: ${{ matrix.dpss }}
        name: Install LAPACK
        uses: PDLPorters/devops/github-actions/install-dep-lapack@master
      - if: ${{ matrix.dpss }}
        run: cpanm -n PDL::LinearAlgebra::Special || ( cat ~/.cpanm/build.log && false )

      - if: ${{ matrix.kaiser }}
        name: Install GSL
        uses: PDLPorters/devops/github-actions/install-dep-gsl@master
      - if: ${{ matrix.kaiser }}
        run: cpanm -n PDL::GSL::SF || ( cat ~/.cpanm/build.log && false )

      - run: perl Makefile.PL

      - if: ${{ !matrix.cover }}
        run: make test

      - if: ${{ matrix.cover }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cover -report Coveralls -test

  build-status:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ always() }}
    needs: [ 'build' ]
    steps:
      - uses: PDLPorters/devops/github-actions/irc-notifications@master
        with:
          target-build-status: true
          needs: ${{ toJSON(needs) }}
